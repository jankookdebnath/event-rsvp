jenkins:
  systemMessage: "Event RSVP - one-click deployment to AWS. Open the event-rsvp-deploy job and click Build Now."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "aws-access-key-id"
              description: "AWS access key ID"
              secret: "${AWS_ACCESS_KEY_ID}"
          - string:
              scope: GLOBAL
              id: "aws-secret-access-key"
              description: "AWS secret access key"
              secret: "${AWS_SECRET_ACCESS_KEY}"

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      pipelineJob('event-rsvp-deploy') {
        description('One click: GitHub -> tests -> Terraform (EC2) -> Docker app live on AWS')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GITHUB_REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
