{% extends "base.html" %}
{% block title %}New event · Event RSVP{% endblock %}
{% block content %}
<h1>Create an event</h1>
<form method="post" class="panel form">
  <label>Title *
    <input name="title" required maxlength="120" value="{{ form.get('title', '') }}">
  </label>
  <label>Date and time *
    <input name="event_date" type="datetime-local" required value="{{ form.get('event_date', '') }}">
  </label>
  <label>Location
    <input name="location" maxlength="120" value="{{ form.get('location', '') }}">
  </label>
  <label>Description
    <textarea name="description" rows="4">{{ form.get('description', '') }}</textarea>
  </label>
  <button class="btn" type="submit">Create event</button>
</form>
{% endblock %}
